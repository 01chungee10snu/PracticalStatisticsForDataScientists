<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기술통계량 분석 실습 - 학습 결과</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        .content {
            padding: 30px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        .stat-label {
            color: #666;
            font-size: 0.9em;
        }
        .achievement {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            margin: 5px;
            font-size: 0.9em;
        }
        .section {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .section h2 {
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>기술통계량 분석 실습</h1>
            <p>학습 완료 시간: 2025-07-21 05:18:06</p>
        </div>
        <div class="content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value">87.5</div>
                    <div class="stat-label">전체 점수</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">29</div>
                    <div class="stat-label">학습 시간 (분)</div>
                </div>
            </div>
            
            <div class="section">
                <h2>🏆 성취 사항</h2>
                <span class="achievement">⭐ 좋은 성과 (80점 이상)</span>
            </div>
            
            <div class="section">
                <h2>📊 학습 요약</h2>
                <p>사용자 <strong>session_test_user</strong>님이 <strong>기술통계량 분석 실습</strong> 과정을 성공적으로 완료했습니다.</p>
                <p>총 <strong>29분</strong> 동안 학습하여 <strong>87.5점</strong>의 성과를 달성했습니다.</p>
            </div>
        </div>
    </div>
</body>
</html>
